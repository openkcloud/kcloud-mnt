# 앱 시크릿 예시 — 실제 값으로 채워 별도 apply. git 커밋 금지(.helmignore 처리).
#   kubectl -n openkcloud-mnt apply -f <이 파일 복사본>
# 추후 SealedSecrets 로 전환.
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-core-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  # CNPG 포털 DB. portal_user 비밀번호는 openkcloud-db-app 시크릿에서 확인.
  DATABASE_URL: "postgresql+psycopg://portal_user:CHANGE_ME@openkcloud-db-rw.openkcloud-mnt:5432/openkcloud_portal"
  # Keycloak mnt-core-client → Credentials 의 비밀키(테스트배드에서 Regenerate 한 값)
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-iaas-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  OS_USERNAME: "CHANGE_ME"
  OS_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-obs-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  # KCloud Monitor v2 관리 계정
  MONITOR_USERNAME: "admin"
  MONITOR_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-workflow-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  # MNT-WORKFLOW/db/temporal_schema.sql 에서 만든 계정 temporal / temporal_view 의 비밀번호
  # (직접 만들지 않고 helm 배포 때 --set-string workflow.dbPassword='<비밀번호>' 로 차트가 만들게 해도 된다)
  POSTGRES_PWD: "CHANGE_ME"
  VISIBILITY_POSTGRES_PWD: "CHANGE_ME"
