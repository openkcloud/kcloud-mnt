# 앱 시크릿 예시 — 실제 값으로 채워 별도 apply. git 커밋 금지(.helmignore 처리).
#   kubectl -n openkcloud-mnt apply -f <이 파일 복사본>
# 추후 SealedSecrets 로 전환.
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-core-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  # CNPG 포털 DB. portal_user 비밀번호는 openkcloud-db-app 시크릿에서 확인.
  DATABASE_URL: "postgresql+psycopg://portal_user:CHANGE_ME@openkcloud-db-rw.openkcloud-mnt:5432/openkcloud_portal"
---
apiVersion: v1
kind: Secret
metadata:
  name: mnt-iaas-secret
  namespace: openkcloud-mnt
type: Opaque
stringData:
  OS_USERNAME: "CHANGE_ME"
  OS_PASSWORD: "CHANGE_ME"
