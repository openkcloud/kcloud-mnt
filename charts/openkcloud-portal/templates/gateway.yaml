{{- if .Values.gateway.enabled }}
{{- $g := .Values.global -}}
{{- $gw := .Values.gateway -}}
{{- if $gw.create }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ $gw.gatewayName }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "okc.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml $gw.istioSelector | nindent 4 }}
  servers:
    - port:
        number: {{ $gw.port }}
        name: https
        protocol: HTTPS
      hosts:
        - {{ $gw.host | quote }}
      tls:
        {{- toYaml $gw.tls | nindent 8 }}
{{- end }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ $gw.gatewayName }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "okc.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ $gw.host | quote }}
  gateways:
    - {{ $gw.gatewayName }}
  http:
    {{- range $name, $b := .Values.backends }}
    {{- if ne (toString $b.enabled) "false" }}
    - match:
        - uri:
            prefix: {{ $b.env.API_PREFIX | quote }}
      route:
        - destination:
            host: {{ printf "mnt-%s.%s.svc.cluster.local" $name $g.namespace }}
            port:
              number: 80
    {{- end }}
    {{- end }}
    # 그 외 전부 → 프론트(mnt-app)
    - route:
        - destination:
            host: {{ printf "mnt-app.%s.svc.cluster.local" $g.namespace }}
            port:
              number: 80
{{- end }}
