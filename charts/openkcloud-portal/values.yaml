# openKcloud 포털 엄브렐러 차트 값
# 배포: helm upgrade --install openkcloud-portal charts/openkcloud-portal -n openkcloud-mnt
# 시크릿(DATABASE_URL, OS_USERNAME/PASSWORD)은 이 파일에 넣지 말 것 → secrets.example.yaml 참고해 별도 apply.

global:
  namespace: openkcloud-mnt
  image:
    registry: harbor.io:7443/mnt   # Harbor 프로젝트 mnt
    tag: develop                   # 공통 태그(배포 시 -set global.image.tag=<git-sha> 로 덮기)
    pullPolicy: IfNotPresent
  # Harbor pull 자격증명 시크릿(docker-registry 타입) — 별도 생성 필요
  imagePullSecrets:
    - name: harbor-pull
  # 컨트롤플레인(마스터) 제외, 워커에만 스케줄
  nodeSelectorWorkerOnly: true
  # 모듈별로 안 덮으면 쓰는 기본 리소스
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# ── 백엔드(FastAPI, 동일 패턴) ───────────────────────────────────────
# env = ConfigMap 으로 주입(비밀값 제외). secretName 지정 시 그 Secret 을 envFrom 으로 추가.
backends:
  core:
    image: mnt-core
    port: 8000
    replicas: 1
    secretName: mnt-core-secret        # DATABASE_URL 제공
    env:
      SERVICE_NAME: mnt-core
      API_PREFIX: /api/core
      CORS_ORIGINS: ""                 # 게이트웨이 single-origin → 빈값
      IAAS_API_BASE: http://mnt-iaas.openkcloud-mnt.svc.cluster.local
      PAAS_API_BASE: http://mnt-paas.openkcloud-mnt.svc.cluster.local
      OBS_API_BASE: http://mnt-obs.openkcloud-mnt.svc.cluster.local
      AINB_API_BASE: ""

  iaas:
    image: mnt-iaas
    port: 8000
    replicas: 1
    secretName: mnt-iaas-secret        # OS_USERNAME / OS_PASSWORD 제공
    env:
      SERVICE_NAME: mnt-iaas
      API_PREFIX: /api/iaas
      CORS_ORIGINS: ""
      CORE_API_BASE: http://mnt-core.openkcloud-mnt.svc.cluster.local
      # OpenStack (2026-10-02 도메인: *.openstack.internal:25443, 사내 root CA 서명)
      OS_AUTH_URL: https://keystone-api.openstack.internal:25443/v3
      OS_PROJECT_NAME: admin
      OS_USER_DOMAIN_NAME: Default
      OS_PROJECT_DOMAIN_NAME: Default
      OS_REGION_NAME: ""
      OS_INSECURE: "true"              # 초기: verify off. root CA 마운트 후 false 로.
      # 엔드포인트 해석: override = ingress 직접(검증된 패턴). catalog 로 바꾸려면 교체.
      OS_ENDPOINT_MODE: override
      OS_ENDPOINT_TEMPLATE: "https://{service}-api.openstack.internal:25443"
      OS_INTERFACE: internal

  paas:
    image: mnt-paas
    port: 8000
    replicas: 1
    env:
      SERVICE_NAME: mnt-paas
      API_PREFIX: /api/paas
      CORS_ORIGINS: ""

  obs:
    image: mnt-obs
    port: 8000
    replicas: 1
    env:
      SERVICE_NAME: mnt-obs
      API_PREFIX: /api/obs
      CORS_ORIGINS: ""

# ── 프론트(Next 정적 + nginx) ───────────────────────────────────────
frontend:
  image: mnt-app
  port: 8080
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

# ── Istio 게이트웨이(single-origin 라우팅) ──────────────────────────
gateway:
  enabled: true
  # 포털 접속 호스트 (TODO: 실제 도메인으로. /etc/hosts → 210.114.95.50 매핑)
  host: portal.kcloud.cluster.local
  # VirtualService 를 바인딩할 Gateway 리소스 이름
  gatewayName: openkcloud-portal
  # true 면 아래 설정으로 Gateway 리소스도 생성. 기존 게이트웨이에 붙이려면 false + gatewayName 지정.
  create: true
  istioSelector:
    istio: ingressgateway
  port: 443
  tls:
    mode: SIMPLE
    credentialName: openkcloud-portal-tls   # istio-system 의 TLS Secret 이름
