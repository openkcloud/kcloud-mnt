# MNT-APP 정적 서빙 (Next.js output:export, trailingSlash:true)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Next 정적 자산 — 해시 파일명이라 장기 캐시
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 프리렌더된 페이지(디렉터리 index.html) 우선 해결.
  # 쿼리파라미터 상세(/iaas/instances/detail/?id=)도 해당 디렉터리로 해결됨.
  location / {
    try_files $uri $uri.html $uri/index.html $uri/ =404;
  }

  error_page 404 /404.html;
}
